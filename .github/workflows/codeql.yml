name: CodeQL

# Advanced CodeQL setup for the shipped language set. It is explicitly not a
# required check while this workflow has not yet executed on the public
# repository. Advanced setup needs public visibility or GitHub Code Security.
# The entitlement gate records DEFERRED_PRIVATE_REPOSITORY or
# DEFERRED_INTERNAL_REPOSITORY instead of treating a skip as a PASS. Metadata
# retrieval failures fail the job rather than being misread as a deferral.
# No pull_request_target, secrets, or privileged build/run step is used.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entitlement:
    name: Check CodeQL entitlement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      supported: ${{ steps.gate.outputs.supported }}
    steps:
      - name: Determine advanced-setup availability
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! visibility_raw="$(gh api "repos/${REPOSITORY}" --jq '.visibility')"; then
            echo "CODEQL_STATUS=METADATA_FETCH_FAILED" >&2
            echo "::error::Unable to retrieve repository visibility; refusing to defer as private."
            exit 1
          fi
          if [ -z "$visibility_raw" ]; then
            echo "CODEQL_STATUS=METADATA_MISSING" >&2
            echo "::error::Repository visibility is empty; refusing to defer as private."
            exit 1
          fi
          visibility="$(printf '%s' "$visibility_raw" | tr '[:upper:]' '[:lower:]')"
          echo "repository visibility: ${visibility} (raw: ${visibility_raw})"
          case "$visibility" in
            public)
              echo "supported=true" >> "$GITHUB_OUTPUT"
              echo "CODEQL_STATUS=ELIGIBLE; analysis will run in the matrix job."
              ;;
            private)
              echo "supported=false" >> "$GITHUB_OUTPUT"
              echo "CODEQL_STATUS=DEFERRED_PRIVATE_REPOSITORY"
              echo "::notice::CodeQL=DEFERRED_PRIVATE_REPOSITORY; advanced setup requires public visibility or GitHub Code Security. This is not a PASS."
              ;;
            internal)
              echo "supported=false" >> "$GITHUB_OUTPUT"
              echo "CODEQL_STATUS=DEFERRED_INTERNAL_REPOSITORY"
              echo "::notice::CodeQL=DEFERRED_INTERNAL_REPOSITORY; advanced-setup entitlement must be verified before analysis. This is not a PASS."
              ;;
            *)
              echo "CODEQL_STATUS=UNKNOWN_VISIBILITY" >&2
              echo "::error::Unexpected repository visibility '${visibility_raw}'; refusing to defer."
              exit 1
              ;;
          esac

  analyze:
    name: Analyze ${{ matrix.language }}
    needs: entitlement
    if: needs.entitlement.outputs.supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build_mode: none
          - language: c-cpp
            build_mode: none
          - language: actions
            build_mode: ''
    steps:
      - name: Checkout source under analysis
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Analysis parameters
        env:
          LANGUAGE: ${{ matrix.language }}
          BUILD_MODE: ${{ matrix.build_mode }}
        run: |
          echo "CodeQL language=${LANGUAGE} build-mode=${BUILD_MODE:-not-applicable}"
          echo "No BPF attach, LSM program load, kill responder, or SENTINEL contact is performed."

      - name: Initialize CodeQL (compiled languages)
        if: matrix.build_mode != ''
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}

      - name: Initialize CodeQL (actions)
        if: matrix.build_mode == ''
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: /language:${{ matrix.language }}
