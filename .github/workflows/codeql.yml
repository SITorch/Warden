name: CodeQL

# Advanced CodeQL setup for the shipped language set. It is explicitly not a
# required check on this private repository: advanced setup needs public
# visibility or GitHub Code Security. The entitlement gate records
# DEFERRED_PRIVATE_REPOSITORY instead of treating a skip as a PASS.
# No pull_request_target, secrets, or privileged build/run step is used.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entitlement:
    name: Check CodeQL entitlement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      supported: ${{ steps.gate.outputs.supported }}
    steps:
      - name: Determine advanced-setup availability
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/${REPOSITORY}" --jq '.visibility')"
          echo "repository visibility: ${visibility}"
          if [ "$visibility" != "PUBLIC" ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "CODEQL_STATUS=DEFERRED_PRIVATE_REPOSITORY"
            echo "::notice::CodeQL=DEFERRED_PRIVATE_REPOSITORY; advanced setup requires public visibility or GitHub Code Security. This is not a PASS."
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "CODEQL_STATUS=ELIGIBLE; analysis will run in the matrix job."
          fi

  analyze:
    name: Analyze ${{ matrix.language }}
    needs: entitlement
    if: needs.entitlement.outputs.supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build_mode: none
          - language: c-cpp
            build_mode: none
          - language: actions
            build_mode: ''
    steps:
      - name: Checkout source under analysis
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Analysis parameters
        env:
          LANGUAGE: ${{ matrix.language }}
          BUILD_MODE: ${{ matrix.build_mode }}
        run: |
          echo "CodeQL language=${LANGUAGE} build-mode=${BUILD_MODE:-not-applicable}"
          echo "No BPF attach, LSM program load, kill responder, or SENTINEL contact is performed."

      - name: Initialize CodeQL (compiled languages)
        if: matrix.build_mode != ''
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}

      - name: Initialize CodeQL (actions)
        if: matrix.build_mode == ''
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: /language:${{ matrix.language }}
