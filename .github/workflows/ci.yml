name: warden-ci

# WARDEN public Alpha CI.
#
# This workflow is UNPRIVILEGED. It never loads BPF, attaches LSM/cgroup
# programs, exercises kill responders, or contacts SENTINEL. The privileged
# runtime test is #[ignore]d and is only checked structurally here; exit 77
# remains SKIP, never PASS. All third-party Actions are pinned to verified
# full-length commit SHAs. Hosted execution is not claimed until a maintainer
# runs this workflow on the actual repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source-gates:
    name: Format, build, test, config and BPF integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust components
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch head, pinned
        with:
          components: rustfmt, clippy

      - name: Install native BPF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: warden-alpha1

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Compilation check
        run: cargo check --all-targets --locked --offline

      - name: Unit and integration tests
        run: cargo test --locked --offline

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked --offline -- -D warnings

      - name: Release build
        run: cargo build --release --locked --offline

      - name: BPF source-to-object rebuild integrity
        run: |
          make bpf
          git diff --exit-code -- bpf/warden.bpf.o bpf/.built-from

      - name: BPF object and embedded-object integrity
        run: |
          cargo test --locked --offline \
            --test embedded_object_is_the_shipped_object \
            --test capability_matrix

      - name: Strict configuration validation
        run: |
          cargo build --locked --offline
          ./target/debug/warden --config-validate --strict --config config/warden.example.toml
          ./target/debug/warden --config-validate --strict --config config/warden.toml

      - name: Configuration-engine CLI regressions
        run: bash scripts/tests/test_config_engine_cli.sh "$PWD/target/debug/warden"

      - name: Installer CLI regressions
        run: bash scripts/tests/test_install_wizard.sh "$PWD/target/debug/warden"

      - name: Privileged test remains skipped in ordinary CI
        run: |
          cargo test --locked --offline --test preopened_fd_guard -- --list \
            | grep -q 'a_preopened_fd_loses_write_access_when_the_guard_is_armed: test'
          rc=0
          bash scripts/test-privileged.sh || rc=$?
          if [ "$rc" -ne 77 ]; then
            echo "expected SKIP(77) on unprivileged CI, got $rc"
            exit 1
          fi
          echo "privileged runtime test: SKIP (NOT_RUN), not PASS"

      - name: SBOM format and inventory verification
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("docs/release/warden_alpha1.spdx.json")
          raw = path.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          expected = "09dd1a06bc11ac6ac7acd995c87b9e1f251c52953f15dc9e9f3820122bdaf218"
          if digest != expected:
              raise SystemExit(f"SBOM digest mismatch: {digest}")
          doc = json.loads(raw)
          if doc.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("unexpected SPDX version")
          if len(doc.get("packages", [])) != 79:
              raise SystemExit("unexpected SBOM package count")
          if len(doc.get("relationships", [])) != 78:
              raise SystemExit("unexpected SBOM relationship count")
          print("SBOM verified: SPDX-2.3, 79 packages, 78 relationships")
          PY

  supply-chain:
    name: Dependency audit and license policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch head, pinned

      - name: Install pinned audit tooling
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo install cargo-deny --version 0.22.1 --locked

      - name: Advisory audit of the locked dependency set
        run: cargo audit --file Cargo.lock

      - name: License and bans policy
        run: cargo deny check licenses bans

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout full history for scanning
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify pinned Gitleaks 8.24.3
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks-8.24.3"
          mkdir -p "$install_dir"
          archive="$install_dir/gitleaks_8.24.3_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          printf '%s  %s\n' \
            '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c' \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          "$install_dir/gitleaks" version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Gitleaks range and scan regressions
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks-8.24.3/gitleaks
        run: |
          set -euo pipefail
          bash .github/scripts/test_gitleaks_range.sh
          bash .github/scripts/test_gitleaks_coverage.sh

      - name: Derive and verify explicit scan range
        id: scan-range
        env:
          GITLEAKS_EVENT: ${{ github.event_name }}
          GITLEAKS_BEFORE: ${{ github.event.before }}
          GITLEAKS_AFTER: ${{ github.event.after }}
          GITLEAKS_DELETED: ${{ github.event.deleted }}
          GITLEAKS_PR_BASE: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/gitleaks_range.sh >> "$GITHUB_OUTPUT"

      - name: Record expected commit identities
        if: steps.scan-range.outputs.mode != 'skip'
        env:
          GITLEAKS_RANGE: ${{ steps.scan-range.outputs.range }}
          GITLEAKS_EXPECTED_COMMITS: ${{ steps.scan-range.outputs.commits }}
          GITLEAKS_REASON: ${{ steps.scan-range.outputs.reason }}
          GITLEAKS_FORCE_PUSH: ${{ steps.scan-range.outputs.force_push }}
        run: |
          set -euo pipefail
          git rev-list --full-history "$GITLEAKS_RANGE" > "$RUNNER_TEMP/gitleaks-expected-commits.txt"
          echo "reason=$GITLEAKS_REASON force_push=$GITLEAKS_FORCE_PUSH expected=$GITLEAKS_EXPECTED_COMMITS"
          echo "expected_first=$(head -n 1 "$RUNNER_TEMP/gitleaks-expected-commits.txt")"
          echo "expected_last=$(tail -n 1 "$RUNNER_TEMP/gitleaks-expected-commits.txt")"

      - name: Explicit skip (empty range or deleted ref)
        if: steps.scan-range.outputs.mode == 'skip'
        env:
          GITLEAKS_REASON: ${{ steps.scan-range.outputs.reason }}
        run: |
          echo "gitleaks: skip reason=$GITLEAKS_REASON; no scan performed"

      - name: Gitleaks detect over verified explicit range
        if: steps.scan-range.outputs.mode != 'skip'
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks-8.24.3/gitleaks
          GITLEAKS_LOG_OPTS: ${{ steps.scan-range.outputs.log_opts }}
          GITLEAKS_EXPECTED_COMMITS: ${{ steps.scan-range.outputs.commits }}
          GITLEAKS_REPORT_PATH: results.sarif
          GITLEAKS_STDERR_LOG: ${{ runner.temp }}/gitleaks-scan.log
        run: bash .github/scripts/gitleaks_scan.sh

      - name: Upload redacted Gitleaks SARIF
        if: ${{ always() && steps.scan-range.outputs.mode != 'skip' && hashFiles('results.sarif') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Documentation link check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Markdown links (local targets only)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --offline './**/*.md'
          fail: true

# Privileged qualification remains intentionally outside hosted CI. It belongs
# in a maintainer-controlled disposable VM with console/out-of-band recovery and
# explicit PASS/FAIL/SKIP/BLOCKED reporting. See scripts/test-privileged.sh and
# docs/release/PRQ_06_ENFORCEMENT_QUALIFICATION.md.
