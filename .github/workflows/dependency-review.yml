name: Dependency Review

# Official Dependency Review Action on pull requests. It reads manifest diffs
# through the GitHub API and does not check out or execute pull-request code.
# No pull_request_target, secrets, or write permissions are used.
# On a private or internal repository the result is an explicit deferral, not
# PASS, and this workflow is not a required check until it succeeds on a
# supported configuration. Metadata retrieval failures fail the job rather
# than being misread as a private-repository deferral.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  entitlement:
    name: Check dependency review entitlement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      supported: ${{ steps.gate.outputs.supported }}
    steps:
      - name: Determine private-plan availability
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! visibility_raw="$(gh api "repos/${REPOSITORY}" --jq '.visibility')"; then
            echo "DEPENDENCY_REVIEW_STATUS=METADATA_FETCH_FAILED" >&2
            echo "::error::Unable to retrieve repository visibility; refusing to defer as private."
            exit 1
          fi
          if [ -z "$visibility_raw" ]; then
            echo "DEPENDENCY_REVIEW_STATUS=METADATA_MISSING" >&2
            echo "::error::Repository visibility is empty; refusing to defer as private."
            exit 1
          fi
          visibility="$(printf '%s' "$visibility_raw" | tr '[:upper:]' '[:lower:]')"
          echo "repository visibility: ${visibility} (raw: ${visibility_raw})"
          case "$visibility" in
            public)
              echo "supported=true" >> "$GITHUB_OUTPUT"
              echo "DEPENDENCY_REVIEW_STATUS=ELIGIBLE; review will run in the next job."
              ;;
            private)
              echo "supported=false" >> "$GITHUB_OUTPUT"
              echo "DEPENDENCY_REVIEW_STATUS=DEFERRED_PRIVATE_REPOSITORY"
              echo "::notice::Dependency Review=DEFERRED_PRIVATE_REPOSITORY; enable and verify it on a supported public configuration before making it required. This is not a PASS."
              ;;
            internal)
              echo "supported=false" >> "$GITHUB_OUTPUT"
              echo "DEPENDENCY_REVIEW_STATUS=DEFERRED_INTERNAL_REPOSITORY"
              echo "::notice::Dependency Review=DEFERRED_INTERNAL_REPOSITORY; entitlement must be verified before review. This is not a PASS."
              ;;
            *)
              echo "DEPENDENCY_REVIEW_STATUS=UNKNOWN_VISIBILITY" >&2
              echo "::error::Unexpected repository visibility '${visibility_raw}'; refusing to defer."
              exit 1
              ;;
          esac

  review:
    name: Review dependency changes
    needs: entitlement
    if: needs.entitlement.outputs.supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Run official Dependency Review Action
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

      - name: Dependency Review result
        if: always()
        run: |
          echo "Dependency Review action finished; consult its annotations above for any newly introduced vulnerable dependency."
          echo "No untrusted pull-request code was checked out or executed by this workflow."
